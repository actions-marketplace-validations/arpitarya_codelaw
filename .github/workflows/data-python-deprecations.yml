# data-python-deprecations — codelaw's table of deprecated Python
# standard-library names kept current (L6 decision 15; L11 D-54; W-187).
# Weekly, and by hand:
#
#     gh workflow run data-python-deprecations.yml -R arpitarya/codelaw
#
# `scripts/data-python-deprecations-check.py --refresh` reads the newest
# stable CPython release tag's `Doc/library` from GitHub's archive of it
# (stdlib `urllib`: nothing is installed or run) and regenerates
# data-packages/python-deprecations/data/python-deprecations.json. When the
# rows changed, the file is committed on `data/python-deprecations-refresh`
# and proposed as ONE pull request for a person to read. The network is this
# job's, never the engine's (L5).
#
# 🔑 Token: GITHUB_TOKEN only.
# ⚠ `gh pr create` needs *Allow GitHub Actions to create and approve pull
#   requests* (Settings → Actions → General) — the decider's, as for fux-bump.
#
# Every `run:` is `bash -eo pipefail`; every action is pinned by commit SHA.
# No third-party action or package (L11): `gh`, `git` and the
# standard-library Python on the runner, and actions ci.yml already pins.
name: data-python-deprecations
on:
  schedule:
    - cron: '30 5 * * 1' # Mondays, 11:00 IST
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: data-python-deprecations
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push data/python-deprecations-refresh
      pull-requests: write # open or update its one PR
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: the table is well-formed
        run: python3 scripts/data-python-deprecations-check.py --check
      - name: regenerate it from CPython's newest stable release
        run: python3 scripts/data-python-deprecations-check.py --refresh
      - name: one pull request with the new rows
        run: |
          if git diff --quiet -- data-packages/python-deprecations/data/python-deprecations.json; then
            echo "nothing new" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 scripts/data-python-deprecations-check.py --check
          branch=data/python-deprecations-refresh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -q -c "$branch"
          git add data-packages/python-deprecations/data/python-deprecations.json
          printf 'W-187: the Python deprecation table regenerated from CPython's docs (data-python-deprecations.yml)\n\nno SR affected\n' | git commit -q -F -
          git push -q --force origin "HEAD:refs/heads/$branch"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          printf 'The Python deprecation table regenerated from CPython's documentation by [data-python-deprecations.yml](%s) (L6 decision 15, L11 D-54). Read the diff of `generated_from`, then the rows that moved.\n' "$run_url" > "$RUNNER_TEMP/body.md"
          pr="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --body-file "$RUNNER_TEMP/body.md" >/dev/null
            echo "updated #$pr" >> "$GITHUB_STEP_SUMMARY"
          else
            gh pr create --base main --head "$branch" --title "data-python-deprecations: regenerated table" --body-file "$RUNNER_TEMP/body.md" >> "$GITHUB_STEP_SUMMARY" || {
              echo "::error title=data-python-deprecations::gh pr create failed — 'Allow GitHub Actions to create and approve pull requests' (Settings → Actions → General) must be on. $branch is pushed."
              exit 1
            }
          fi
