description = "eslint-plugin-testing-library 7.16.2's `react` config, reimplemented (W-139); `js/no-focused-tests` and `js/skipped-test` cover its focused- and disabled-test rules"

[rules]
"testing/testing-library-await-async-events" = "error"
"testing/testing-library-await-async-queries" = "error"
"testing/testing-library-await-async-utils" = "error"
"testing/testing-library-no-await-sync-events" = "error"
"testing/testing-library-no-await-sync-queries" = "error"
"testing/testing-library-no-container" = "warn"
"testing/testing-library-no-debugging-utils" = "warn"
"testing/testing-library-no-dom-import" = "error"
"testing/testing-library-no-global-regexp-flag-in-query" = "error"
"testing/testing-library-no-manual-cleanup" = "warn"
"testing/testing-library-no-node-access" = "warn"
"testing/testing-library-no-promise-in-fire-event" = "error"
"testing/testing-library-no-render-in-lifecycle" = "warn"
"testing/testing-library-no-unnecessary-act" = "warn"
"testing/testing-library-no-wait-for-multiple-assertions" = "error"
"testing/testing-library-no-wait-for-side-effects" = "error"
"testing/testing-library-no-wait-for-snapshot" = "error"
"testing/testing-library-prefer-find-by" = "error"
"testing/testing-library-prefer-presence-queries" = "error"
"testing/testing-library-prefer-query-by-disappearance" = "warn"
"testing/testing-library-prefer-screen-queries" = "warn"
"testing/testing-library-render-result-naming-convention" = "warn"
