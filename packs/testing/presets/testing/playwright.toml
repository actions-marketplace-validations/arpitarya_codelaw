description = "eslint-plugin-playwright 2.12.1's `recommended`, reimplemented (W-139); `js/no-focused-tests` and `js/skipped-test` cover its focused- and disabled-test rules"

[rules]
"testing/playwright-expect-expect" = "warn"
"testing/playwright-max-nested-describe" = "warn"
"testing/playwright-missing-playwright-await" = "error"
"testing/playwright-no-conditional-expect" = "warn"
"testing/playwright-no-conditional-in-test" = "warn"
"testing/playwright-no-duplicate-hooks" = "warn"
"testing/playwright-no-duplicate-slow" = "warn"
"testing/playwright-no-element-handle" = "warn"
"testing/playwright-no-eval" = "warn"
"testing/playwright-no-force-option" = "warn"
"testing/playwright-no-identical-title" = "error"
"testing/playwright-no-nested-step" = "warn"
"testing/playwright-no-networkidle" = "warn"
"testing/playwright-no-page-pause" = "warn"
"testing/playwright-no-standalone-expect" = "error"
"testing/playwright-no-unnecessary-assertions" = "error"
"testing/playwright-no-unsafe-references" = "error"
"testing/playwright-no-unused-locators" = "warn"
"testing/playwright-no-useless-await" = "warn"
"testing/playwright-no-useless-not" = "warn"
"testing/playwright-no-wait-for-navigation" = "warn"
"testing/playwright-no-wait-for-selector" = "warn"
"testing/playwright-no-wait-for-timeout" = "warn"
"testing/playwright-prefer-hooks-in-order" = "warn"
"testing/playwright-prefer-hooks-on-top" = "warn"
"testing/playwright-prefer-locator" = "warn"
"testing/playwright-prefer-to-have-count" = "error"
"testing/playwright-prefer-to-have-length" = "error"
"testing/playwright-prefer-web-first-assertions" = "warn"
"testing/playwright-valid-describe-callback" = "error"
"testing/playwright-valid-expect" = "error"
"testing/playwright-valid-expect-in-promise" = "error"
"testing/playwright-valid-test-tags" = "error"
"testing/playwright-valid-title" = "error"
