description = "eslint-plugin-jest 29.17.0's `recommended`, reimplemented (W-139); `js/no-focused-tests` and `js/skipped-test` cover its focused- and disabled-test rules"

[rules]
"testing/expect-expect" = "warn"
"testing/no-alias-methods" = "error"
"testing/no-commented-out-tests" = "warn"
"testing/no-conditional-expect" = "error"
"testing/no-deprecated-functions" = "error"
"testing/no-done-callback" = "error"
"testing/no-export" = "error"
"testing/no-identical-title" = "error"
"testing/no-interpolation-in-snapshots" = "error"
"testing/no-jasmine-globals" = "error"
"testing/no-mocks-import" = "error"
"testing/no-standalone-expect" = "error"
"testing/no-test-prefixes" = "error"
"testing/valid-describe-callback" = "error"
"testing/valid-expect" = "error"
"testing/valid-expect-in-promise" = "error"
"testing/valid-title" = "error"
