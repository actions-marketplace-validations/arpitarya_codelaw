extends = ["codelaw:py/recommended"]
description = "`py/recommended` plus the rest of Ruff's stable rules, reimplemented, at `warn` — every rule Ruff ships stable that no other `py/*` preset holds, apart from the `D` rules (`py/pydocstyle`), the copyright-notice rule (a team's policy) and the options-only `py/missing-required-import`; Ruff's preview rules stay out; opt in (W-192, B-048)"

