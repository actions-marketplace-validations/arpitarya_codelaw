description = "pydocstyle's `D` rules as Ruff runs them with no convention set, reimplemented, at `warn`; `D203` (a formatter's) and `D213` (it contradicts `D212`, and Ruff drops it when both are on) are left out; opt in (W-192, B-048)"

[rules]
"py/bad-docstring-quotes" = "warn"
"py/blank-lines-between-header-and-content" = "warn"
"py/docstring-starts-with-this" = "warn"
"py/docstring-tab-indentation" = "warn"
"py/empty-docstring" = "warn"
"py/empty-docstring-section" = "warn"
"py/escape-sequence-in-docstring" = "warn"
"py/first-word-uncapitalized" = "warn"
"py/incorrect-section-order" = "warn"
"py/mismatched-section-underline-length" = "warn"
"py/missing-blank-line-after-last-section" = "warn"
"py/missing-blank-line-after-summary" = "warn"
"py/missing-dashed-underline-after-section" = "warn"
"py/missing-new-line-after-section-name" = "warn"
"py/missing-section-name-colon" = "warn"
"py/missing-section-underline-after-name" = "warn"
"py/missing-terminal-punctuation" = "warn"
"py/missing-trailing-period" = "warn"
"py/multi-line-summary-first-line" = "warn"
"py/new-line-after-last-paragraph" = "warn"
"py/no-blank-line-after-section" = "warn"
"py/no-blank-line-before-section" = "warn"
"py/non-capitalized-section-name" = "warn"
"py/over-indentation" = "warn"
"py/overindented-section" = "warn"
"py/overindented-section-underline" = "warn"
"py/overload-with-docstring" = "warn"
"py/signature-in-docstring" = "warn"
"py/under-indentation" = "warn"
"py/undocumented-magic-method" = "warn"
"py/undocumented-param" = "warn"
"py/undocumented-public-class" = "warn"
"py/undocumented-public-function" = "warn"
"py/undocumented-public-init" = "warn"
"py/undocumented-public-method" = "warn"
"py/undocumented-public-module" = "warn"
"py/undocumented-public-nested-class" = "warn"
"py/undocumented-public-package" = "warn"
"py/unnecessary-multiline-docstring" = "warn"
