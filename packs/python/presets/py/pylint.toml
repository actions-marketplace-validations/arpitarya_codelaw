description = "Pylint 4.1.3's own checkers — everything it enables with no plugin loaded — reimplemented from its documented behaviour, at its categories (`E` error, `W` warn, `R` and `C` info); its optional extensions (docparams, typing, code_style and the rest) are left out; opt in (W-139, ruled 2026-10-30 on W-144: R7; built W-192)"

