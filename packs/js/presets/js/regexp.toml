description = "eslint-plugin-regexp 3.3.2's recommended rules, reimplemented on codelaw's own regular-expression parser (W-139); `js/recommended` extends it"

[rules]
"js/regexp-confusing-quantifier" = "warn"
"js/regexp-control-character-escape" = "error"
"js/regexp-match-any" = "error"
"js/regexp-negation" = "error"
"js/regexp-no-contradiction-with-assertion" = "error"
"js/regexp-no-dupe-characters-character-class" = "error"
"js/regexp-no-dupe-disjunctions" = "error"
"js/regexp-no-empty-alternative" = "warn"
"js/regexp-no-empty-group" = "error"
"js/regexp-no-escape-backspace" = "error"
"js/regexp-no-extra-lookaround-assertions" = "error"
"js/regexp-no-invisible-character" = "error"
"js/regexp-no-lazy-ends" = "warn"
"js/regexp-no-misleading-capturing-group" = "error"
"js/regexp-no-misleading-unicode-character" = "error"
"js/regexp-no-missing-g-flag" = "error"
"js/regexp-no-non-standard-flag" = "error"
"js/regexp-no-obscure-range" = "error"
"js/regexp-no-optional-assertion" = "error"
"js/regexp-no-super-linear-backtracking" = "error"
"js/regexp-no-trivially-nested-assertion" = "error"
"js/regexp-no-trivially-nested-quantifier" = "error"
"js/regexp-no-unused-capturing-group" = "error"
"js/regexp-no-useless-assertions" = "error"
"js/regexp-no-useless-character-class" = "error"
"js/regexp-no-useless-dollar-replacements" = "error"
"js/regexp-no-useless-escape" = "error"
"js/regexp-no-useless-flag" = "warn"
"js/regexp-no-useless-lazy" = "error"
"js/regexp-no-useless-non-capturing-group" = "error"
"js/regexp-no-useless-quantifier" = "error"
"js/regexp-no-useless-range" = "error"
"js/regexp-no-useless-set-operand" = "error"
"js/regexp-no-useless-string-literal" = "error"
"js/regexp-no-useless-two-nums-quantifier" = "error"
"js/regexp-no-zero-quantifier" = "error"
"js/regexp-optimal-lookaround-quantifier" = "warn"
"js/regexp-optimal-quantifier-concatenation" = "error"
"js/regexp-prefer-character-class" = "error"
"js/regexp-prefer-d" = "error"
"js/regexp-prefer-plus-quantifier" = "error"
"js/regexp-prefer-predefined-assertion" = "error"
"js/regexp-prefer-question-quantifier" = "error"
"js/regexp-prefer-range" = "error"
"js/regexp-prefer-set-operation" = "error"
"js/regexp-prefer-star-quantifier" = "error"
"js/regexp-prefer-unicode-codepoint-escapes" = "error"
"js/regexp-prefer-w" = "error"
"js/regexp-simplify-set-operations" = "error"
"js/regexp-sort-flags" = "error"
"js/regexp-strict" = "error"
"js/regexp-use-ignore-case" = "error"
