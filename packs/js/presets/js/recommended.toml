description = "The correctness core of ESLint's recommended preset (@eslint/js 10.0.1), eslint-plugin-promise 7.3.0's recommended, and the rules Biome 2.6.4 recommends that no other tool has (W-139), reimplemented"

[rules]
"js/constructor-super" = "error"
"js/for-direction" = "error"
"js/getter-return" = "error"
"js/no-accumulating-spread" = "error"
"js/no-async-promise-executor" = "error"
"js/no-case-declarations" = "error"
"js/no-class-assign" = "error"
"js/no-compare-neg-zero" = "error"
"js/no-cond-assign" = "error"
"js/no-console" = "warn"
"js/no-const-assign" = "error"
"js/no-constant-binary-expression" = "error"
"js/no-constant-condition" = "error"
"js/no-control-regex" = "error"
"js/no-debugger" = "error"
"js/no-delete-var" = "error"
"js/no-document-cookie-biome" = "error"
"js/no-dupe-args" = "error"
"js/no-dupe-class-members" = "error"
"js/no-dupe-else-if" = "error"
"js/no-dupe-keys" = "error"
"js/no-duplicate-case" = "error"
"js/no-dynamic-namespace-import-access" = "error"
"js/no-empty" = "error"
"js/no-empty-character-class" = "error"
"js/no-empty-pattern" = "error"
"js/no-empty-static-block" = "error"
"js/no-ex-assign" = "error"
"js/no-extra-boolean-cast" = "error"
"js/no-fallthrough" = "error"
"js/no-flat-map-identity" = "error"
"js/no-func-assign" = "error"
"js/no-global-assign" = "error"
"js/no-global-is-finite" = "error"
"js/no-global-is-nan" = "error"
"js/no-import-assign" = "error"
"js/no-invalid-regexp" = "error"
"js/no-irregular-whitespace" = "error"
"js/no-loss-of-precision" = "error"
"js/no-misleading-character-class" = "error"
"js/no-misrefactored-shorthand-assign" = "error"
"js/no-new-native-nonconstructor" = "error"
"js/no-nonoctal-decimal-escape" = "error"
"js/no-obj-calls" = "error"
"js/no-octal" = "error"
"js/no-prototype-builtins" = "error"
"js/no-redeclare" = "error"
"js/no-redundant-use-strict" = "error"
"js/no-regex-spaces" = "error"
"js/no-self-assign" = "error"
"js/no-setter-return" = "error"
"js/no-shadow-restricted-names" = "error"
"js/no-sparse-arrays" = "error"
"js/no-string-case-mismatch" = "error"
"js/no-this-before-super" = "error"
"js/no-this-in-static" = "error"
"js/no-unassigned-vars" = "error"
"js/no-undef" = "error"
"js/no-unexpected-multiline" = "error"
"js/no-unreachable" = "error"
"js/no-unsafe-finally" = "error"
"js/no-unsafe-negation" = "error"
"js/no-unsafe-optional-chaining" = "error"
"js/no-unused-function-parameters" = "warn"
"js/no-unused-imports" = "warn"
"js/no-unused-labels" = "error"
"js/no-unused-private-class-members" = "error"
"js/no-unused-vars" = "error"
"js/no-useless-assignment" = "error"
"js/no-useless-backreference" = "error"
"js/no-useless-catch" = "error"
"js/no-useless-continue-biome" = "error"
"js/no-useless-escape" = "error"
"js/no-useless-string-raw" = "error"
"js/no-void-type-return" = "error"
"js/no-with" = "error"
"js/preserve-caught-error" = "error"
"js/promise-always-return" = "error"
"js/promise-catch-or-return" = "error"
"js/promise-no-callback-in-promise" = "warn"
"js/promise-no-nesting" = "warn"
"js/promise-no-new-statics" = "error"
"js/promise-no-promise-in-callback" = "warn"
"js/promise-no-return-in-finally" = "warn"
"js/promise-no-return-wrap" = "error"
"js/promise-param-names" = "error"
"js/promise-valid-params" = "warn"
"js/require-yield" = "error"
"js/use-instead" = "warn"
"js/use-isnan" = "error"
"js/use-simple-number-keys" = "error"
"js/valid-typeof" = "error"

[scope.tests]
files = ["**/*.test.*", "**/*.spec.*"]

[scope.stories]
files = ["**/*.stories.*"]

[scope.config]
files = ["**/*.config.*"]
