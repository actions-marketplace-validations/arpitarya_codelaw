description = "eslint-plugin-jsdoc 65.4.2 recommended, reimplemented as js/jsdoc-* rules at the plugin's warn; opt in (W-139, ruled 2026-10-30 on W-144: R7)"

[rules]
"js/jsdoc-check-access" = "warn"
"js/jsdoc-check-param-names" = "warn"
"js/jsdoc-check-property-names" = "warn"
"js/jsdoc-check-tag-names" = "warn"
"js/jsdoc-check-types" = "warn"
"js/jsdoc-check-values" = "warn"
"js/jsdoc-empty-tags" = "warn"
"js/jsdoc-escape-inline-tags" = "warn"
"js/jsdoc-implements-on-classes" = "warn"
"js/jsdoc-multiline-blocks" = "warn"
"js/jsdoc-no-defaults" = "warn"
"js/jsdoc-no-multi-asterisks" = "warn"
"js/jsdoc-no-undefined-types" = "warn"
"js/jsdoc-reject-any-type" = "warn"
"js/jsdoc-reject-function-type" = "warn"
"js/jsdoc-require-jsdoc" = "warn"
"js/jsdoc-require-next-type" = "warn"
"js/jsdoc-require-param" = "warn"
"js/jsdoc-require-param-description" = "warn"
"js/jsdoc-require-param-name" = "warn"
"js/jsdoc-require-param-type" = "warn"
"js/jsdoc-require-property" = "warn"
"js/jsdoc-require-property-description" = "warn"
"js/jsdoc-require-property-name" = "warn"
"js/jsdoc-require-property-type" = "warn"
"js/jsdoc-require-returns" = "warn"
"js/jsdoc-require-returns-check" = "warn"
"js/jsdoc-require-returns-description" = "warn"
"js/jsdoc-require-returns-type" = "warn"
"js/jsdoc-require-throws-type" = "warn"
"js/jsdoc-require-yields" = "warn"
"js/jsdoc-require-yields-check" = "warn"
"js/jsdoc-require-yields-type" = "warn"
"js/jsdoc-tag-lines" = "warn"
"js/jsdoc-ts-no-empty-object-type" = "warn"
"js/jsdoc-valid-types" = "warn"
